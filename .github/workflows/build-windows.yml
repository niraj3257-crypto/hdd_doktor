name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - niraj3257-crypto-run-hdd-doktor

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release executable
        run: cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: hdd-doktor-windows
          path: target\release\hdd_doktor.exe

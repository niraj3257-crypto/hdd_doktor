<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36d399" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#36d399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#36d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feColorMatrix in="o" values="0 0 0 0 0.02  0 0 0 0 0.05  0 0 0 0 0.08  0 0 0 0.5 0"/>
      <feBlend in="SourceGraphic" in2="o"/>
    </filter>
  </defs>

  <!-- Arka pulse -->
  <circle cx="128" cy="128" r="120" fill="url(#pulse)"/>

  <!-- Rounded background -->
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="#071020"/>
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="url(#brand)" opacity="0.08"/>
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="none" stroke="url(#brand)" stroke-width="2.5" opacity="0.6"/>

  <!-- HDD body (3D-ish) -->
  <g transform="translate(128,128)" filter="url(#softshadow)">
    <!-- Alt gölge/plate -->
    <rect x="-72" y="-50" width="144" height="100" rx="10" fill="#0f172a" stroke="url(#brand)" stroke-width="3"/>
    <!-- Üst plaka vidaları -->
    <circle cx="-62" cy="-40" r="3" fill="#36d399"/>
    <circle cx="62" cy="-40" r="3" fill="#36d399"/>
    <circle cx="-62" cy="40" r="3" fill="#36d399"/>
    <circle cx="62" cy="40" r="3" fill="#36d399"/>

    <!-- Platter (dönen disk) -->
    <circle cx="-10" cy="0" r="38" fill="url(#disk)" stroke="url(#brand)" stroke-width="2"/>
    <circle cx="-10" cy="0" r="32" fill="none" stroke="#36d399" stroke-width="0.6" opacity="0.4"/>
    <circle cx="-10" cy="0" r="24" fill="none" stroke="#36d399" stroke-width="0.6" opacity="0.4"/>
    <circle cx="-10" cy="0" r="16" fill="none" stroke="#36d399" stroke-width="0.6" opacity="0.4"/>
    <!-- Center spindle -->
    <circle cx="-10" cy="0" r="6" fill="url(#brand)"/>
    <circle cx="-10" cy="0" r="2.5" fill="#071020"/>

    <!-- Read/write head arm (actuator) -->
    <g transform="translate(-10,0) rotate(-30)">
      <rect x="18" y="-3" width="40" height="6" rx="2.5" fill="url(#brand)"/>
      <polygon points="56,0 48,-5 48,5" fill="url(#brand)"/>
      <circle cx="18" cy="0" r="4.5" fill="#071020" stroke="url(#brand)" stroke-width="2"/>
    </g>
  </g>

  <!-- Medical plus (sağ üst) — "doktor" vurgusu -->
  <g transform="translate(192,64)" filter="url(#softshadow)">
    <circle cx="0" cy="0" r="26" fill="url(#brand)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#071020" stroke-width="2"/>
    <rect x="-3" y="-14" width="6" height="28" rx="2" fill="#071020"/>
    <rect x="-14" y="-3" width="28" height="6" rx="2" fill="#071020"/>
  </g>

  <!-- Nabız çizgisi (sağlık monitörü) sol alt -->
  <g transform="translate(60,196)" opacity="0.9">
    <polyline points="-20,0 -12,0 -8,-10 -4,10 0,-18 4,10 8,-10 12,0 20,0"
              fill="none" stroke="#36d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
